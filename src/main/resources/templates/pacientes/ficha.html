<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Ficha del paciente')}"></head>
<body>

    <header th:replace="~{fragments/header :: encabezado}"></header>

    <main class="container py-4">

        <div th:replace="~{fragments/header :: mensajes}"></div>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <div class="d-flex flex-wrap justify-content-between align-items-start gap-2">
                    <div>
                        <h1 class="h3 mb-1">
                            <span th:text="${paciente.nombreCompleto}">Pérez, Ana</span>
                            <span th:unless="${paciente.activo}" class="badge text-bg-secondary align-middle">Dado de baja</span>
                        </h1>
                        <div class="text-muted">
                            DNI <span th:text="${paciente.dni}">30111222</span> ·
                            Obra social: <span th:text="${paciente.obraSocial}">OSDE</span> ·
                            Tel.: <span th:text="${paciente.telefono} ?: '-'">-</span>
                        </div>
                    </div>
                    <div th:if="${paciente.activo}" class="text-nowrap">
                        <!-- Crea la relación: abre el formulario de turno con este paciente elegido. -->
                        <a class="btn btn-success" th:href="@{/turnos/nuevo(pacienteId=${paciente.id})}">+ Asignar turno</a>
                        <a class="btn btn-outline-secondary" th:href="@{/pacientes/{id}/editar(id=${paciente.id})}">Modificar</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Relación uno a muchos: historial de turnos del paciente. -->
        <h2 class="h5">Historial de turnos (<span th:text="${#lists.size(turnos)}">0</span>)</h2>
        <div th:replace="~{fragments/turnos :: tabla(${turnos}, '/pacientes/' + ${paciente.id})}"></div>

        <a class="btn btn-outline-secondary" th:href="@{/pacientes}">← Volver al listado</a>
    </main>

    <th:block th:replace="~{fragments/header :: scripts}"></th:block>
</body>
</html>
