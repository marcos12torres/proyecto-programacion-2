<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- Barra de navegación común a todas las pantallas. -->
    <header th:fragment="encabezado">
        <nav class="navbar navbar-expand-lg navbar-dark barra">
            <div class="container">
                <a class="navbar-brand fw-bold" th:href="@{/}">🏥 Clínica</a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                        data-bs-target="#menu" aria-controls="menu" aria-expanded="false"
                        aria-label="Abrir menú">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="menu">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item"><a class="nav-link" th:href="@{/}">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/pacientes}">Pacientes</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/medicos}">Médicos</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/turnos}">Turnos</a></li>
                    </ul>
                    <a class="btn btn-light btn-sm" th:href="@{/turnos/nuevo}">+ Asignar turno</a>
                </div>
            </div>
        </nav>
    </header>

    <!-- Mensajes de confirmación (exito) o error enviados por el controlador. -->
    <div th:fragment="mensajes">
        <div th:if="${exito}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${exito}">Operación realizada.</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <strong>Error:</strong> <span th:text="${error}">Mensaje de error.</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
        </div>
    </div>

    <!-- JavaScript de Bootstrap (menú colapsable y cierre de alertas). -->
    <th:block th:fragment="scripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </th:block>

</body>
</html>
